name: Fix PDF sharing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix PDF sharing on Android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PDF sharing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          replacement = r'''async function sharePdf(){if(!currentQuote)return;const btn=$('printBtn'),old=btn.textContent;try{if(typeof html2pdf==='undefined')throw new Error('PDF library not loaded');btn.disabled=true;btn.textContent='Creating PDF…';const element=$('quotePreview');const filename=`${currentQuote.number}-${(currentQuote.customerName||'quote').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')}.pdf`;const opt={margin:0.2,filename,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},pagebreak:{mode:['css','legacy']},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};const blob=await html2pdf().set(opt).from(element).outputPdf('blob');const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share){try{if(!navigator.canShare||navigator.canShare({files:[file]})){throw new Error('File sharing is not supported on this device')}await navigator.share({title:`Quote ${currentQuote.number}`,text:`Quote ${currentQuote.number} for ${currentQuote.customerName||'customer'}`,files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);alert('PDF saved to your phone. Open WhatsApp or email and attach the PDF from your Downloads folder.')}catch(e){if(e&&e.name!=='AbortError')alert('Could not create the PDF. Please try again.')}finally{btn.disabled=false;btn.textContent=old}}'''
          pattern = r'async function sharePdf\(\)\{.*?\}\$\(\'newQuoteBtn\'\)'
          ns, n = re.subn(pattern, replacement + "$('newQuoteBtn')", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find sharePdf function')
          p.write_text(ns)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-pdf-share.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix PDF sharing on Android"
          git push
