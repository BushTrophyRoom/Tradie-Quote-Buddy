<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Invoice • Tradie Quote Buddy</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif;padding:20px}.card{max-width:850px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 3px 18px #0001;padding:28px}.head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #111;padding-bottom:20px}.brand{font-size:24px;font-weight:800;margin-bottom:6px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b66e00;font-weight:800}.muted{color:#666;font-size:13px;line-height:1.5}.meta{text-align:right}.invoice-no{font-size:25px;font-weight:800;margin:5px 0}.status{display:inline-block;margin-top:8px;padding:6px 11px;border-radius:999px;background:#fff2cf;color:#8a5a00;font-size:12px;font-weight:800}.section{margin-top:24px;line-height:1.5}.section h3{font-size:12px;letter-spacing:1px;margin:0 0 7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left}th:nth-child(n+2),td:nth-child(n+2){text-align:right}.totals{margin:20px 0 0 auto;width:300px}.totals div{display:flex;justify-content:space-between;padding:6px}.totals .grand{font-size:20px;font-weight:800;border-top:2px solid #111;margin-top:5px;padding-top:12px}.payment{margin-top:28px;padding:17px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.actions button{flex:1;min-width:180px;border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.pdf{background:#ffb000;color:#111}.back{background:#e5e7eb;color:#111}.note{margin-top:18px;color:#666;font-size:12px;line-height:1.5}@media(max-width:600px){body{padding:10px}.card{padding:20px}.head{flex-direction:column}.meta{text-align:left}.totals{width:100%}}@media print{body{background:#fff;padding:0}.card{box-shadow:none;border-radius:0;max-width:none}.actions{display:none}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script></head><body><main class="card" id="app">Loading invoice…</main><script>(function(){'use strict';function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).replace(/\r/g,'').trim()}function dec(v){try{var p=v.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}function esc(v){return clean(v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}function money(v){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(v)||0)}var d=dec(new URLSearchParams(location.search).get('data')||'');if(!d||!d.number){$('app').innerHTML='<h2>Invoice link unavailable</h2><p class="muted">This invoice link is invalid or incomplete. Please contact the business.</p>';return}var rows=(Array.isArray(d.items)?d.items:[]).map(function(x){var qty=x.qty==null?1:Number(x.qty)||0,unit=x.unitPrice==null?Number(x.amount)||0:Number(x.unitPrice)||0;return[String(x.description||''),String(qty),money(unit),money(qty*unit)]});if(Number(d.labourHours)>0)rows.push(['Labour',Number(d.labourHours)+' hrs',money(d.hourlyRate)+'/hr',money(d.labour)]);if(!rows.length)rows=[['No item breakdown supplied.','','','']];$('app').innerHTML='<div class="head"><div><div class="eyebrow">TRADIE QUOTE BUDDY</div><div class="brand">'+esc(d.businessName)+'</div><div class="muted">'+esc(d.businessAddress)+'<br>'+esc(d.businessPhone)+'<br>'+esc(d.businessEmail)+(d.abn?'<br>ABN '+esc(d.abn):'')+'</div></div><div class="meta"><div class="eyebrow">INVOICE</div><div class="invoice-no">'+esc(d.number)+'</div><div class="muted">Issued: '+esc(d.invoiceDate)+'<br>Due: '+esc(d.dueDate)+'</div><span class="status">'+esc(d.status||'Unpaid')+'</span></div></div><div class="section"><h3>BILL TO</h3><b>'+esc(d.customerName)+'</b><br>'+esc(d.customerPhone)+'<br>'+esc(d.customerEmail)+'<br>'+esc(d.customerAddress).replace(/\n/g,'<br>')+'</div><div class="section"><h3>JOB</h3>'+esc(d.jobDescription||'No job description supplied.').replace(/\n/g,'<br>')+'</div><div class="section table-wrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'}).join('')+'</tbody></table></div><div class="totals"><div><span>Subtotal</span><span>'+money(d.subtotal)+'</span></div>'+(Number(d.discount)>0?'<div><span>Discount</span><span>-'+money(d.discount)+'</span></div>':'')+'<div><span>GST</span><span>'+money(d.gst)+'</span></div><div class="grand"><span>Total due</span><span>'+money(d.total)+'</span></div></div><div class="payment"><b>Payment terms</b><br>Payment due within '+esc(d.paymentTermsDays||7)+' days, by '+esc(d.dueDate)+'.<div class="note">Please contact the business if you have any questions about this invoice.</div></div><div class="actions"><button class="back" onclick="history.back()">← Back</button><button class="pdf" id="downloadPdf">📄 Download PDF</button></div><div class="note">You can save this invoice as a PDF using the button above, or use your browser's Share/Print options.</div>';$('downloadPdf').onclick=function(){var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=16,W=210,H=297,y=M,C=W-M*2;function wrap(t,x,w,size,b){doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(size||10);var a=doc.splitTextToSize(clean(t),w);doc.text(a,x,y);y+=a.length*((size||10)*.42)+2}function ensure(h){if(y+h>H-M){doc.addPage();y=M}}doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('TRADIE QUOTE BUDDY',M,y);y+=7;doc.setFontSize(19);doc.text(clean(d.businessName),M,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text([d.businessAddress,d.businessPhone,d.businessEmail,d.abn?'ABN '+d.abn:''].filter(Boolean).join('\n'),M,y);var rx=W-M-58;doc.setFont('helvetica','bold');doc.text('INVOICE',rx,y-6);doc.setFontSize(17);doc.text(clean(d.number),rx,y+1);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Issued: '+clean(d.invoiceDate),rx,y+8);doc.text('Due: '+clean(d.dueDate),rx,y+14);y+=24;doc.line(M,y,W-M,y);y+=8;wrap('BILL TO',M,C,9,true);wrap(d.customerName,M,C,11,true);wrap([d.customerPhone,d.customerEmail,d.customerAddress].filter(Boolean).join('\n'),M,C,9,false);y+=3;wrap('JOB',M,C,9,true);wrap(d.jobDescription||'No job description supplied.',M,C,10,false);y+=3;ensure(45);doc.autoTable({startY:y,margin:{left:M,right:M},head:[['Description','Qty','Unit price','Amount']],body:rows,theme:'grid',styles:{font:'helvetica',fontSize:8,cellPadding:2.5},headStyles:{fontStyle:'bold',fillColor:[35,35,35],textColor:[255,255,255]},columnStyles:{0:{cellWidth:82},1:{cellWidth:25,halign:'right'},2:{cellWidth:35,halign:'right'},3:{cellWidth:37,halign:'right'}}});y=doc.lastAutoTable.finalY+8;ensure(42);var tx=W-M-70;function tr(l,v,b){doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?12:9);doc.text(l,tx,y);doc.text(clean(v),W-M,y,{align:'right'});y+=6}tr('Subtotal',money(d.subtotal),false);if(Number(d.discount)>0)tr('Discount','-'+money(d.discount),false);tr('GST',money(d.gst),false);doc.line(tx,y-2,W-M,y-2);y+=3;tr('TOTAL DUE',money(d.total),true);ensure(28);y+=8;wrap('PAYMENT TERMS',M,C,9,true);wrap('Payment due within '+(d.paymentTermsDays||7)+' days, by '+clean(d.dueDate)+'.',M,C,9,false);doc.save('Invoice-'+clean(d.number)+'.pdf')};})();</script></body></html>
