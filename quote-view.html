<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Quote • Tradie Quote Buddy</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif;padding:20px}.card{max-width:760px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 3px 18px #0001;padding:26px}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b66e00;font-weight:800}.brand{font-size:22px;font-weight:800;margin-top:4px}.muted{color:#666;font-size:13px;line-height:1.45}.meta{text-align:right}.quote-no{font-size:24px;font-weight:800;margin-top:4px}.section{margin-top:22px}.section h3{font-size:12px;letter-spacing:1px;margin:0 0 7px}.customer{line-height:1.5}.job{line-height:1.5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left}th:nth-child(n+2),td:nth-child(n+2){text-align:right}.totals{margin:18px 0 0 auto;width:280px}.totals div{display:flex;justify-content:space-between;padding:5px}.totals .grand{font-size:20px;font-weight:800;border-top:2px solid #111;margin-top:5px;padding-top:10px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.actions a,.actions button{flex:1;min-width:180px;border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}.accept{background:#16803c;color:#fff}.decline{background:#e53935;color:#fff}.pdf{background:#ffb000;color:#111}.note{margin-top:18px;padding:14px;border-radius:12px;background:#f5f5f5;color:#555;font-size:12px;line-height:1.5}@media(max-width:600px){.head{flex-direction:column}.meta{text-align:left}.totals{width:100%}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script></head><body><main class="card" id="app">Loading quote…</main><script>(function(){'use strict';var RESPONSE_BASE='https://bushtrophyroom.github.io/Tradie-Quote-Buddy/respond-v2.html?v=4&data=';function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).replace(/\r/g,'').trim()}function dec(v){try{var p=v.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}function enc(o){var s=JSON.stringify(o),b=btoa(unescape(encodeURIComponent(s)));return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function esc(v){return clean(v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}function money(v){return clean(v)}function parseItem(v){var p=v.split('|').map(function(x){return x.trim()});return[p[0]||'',(p[1]||'').replace(/^Qty:\s*/i,''),(p[2]||'').replace(/^Unit:\s*/i,''),(p[3]||'').replace(/^Amount:\s*/i,'')]}var d=dec(new URLSearchParams(location.search).get('data')||'');if(!d||!d.quote_number){$('app').innerHTML='<h2>Quote link unavailable</h2><p class="muted">This quote link is invalid or incomplete. Please contact the business.</p>';return}var accept=Object.assign({},d,{decision:'Accepted',quote_status:'Accepted',responded_at:new Date().toLocaleString('en-AU')}),decline=Object.assign({},d,{decision:'Declined',quote_status:'Declined',responded_at:new Date().toLocaleString('en-AU')}),acceptUrl=RESPONSE_BASE+enc(accept),declineUrl=RESPONSE_BASE+enc(decline),rows=(d.materials_details||d.item_details||'').split(/\n+/).filter(Boolean).map(parseItem);if(d.labour_details)rows.push((function(v){var h='',r='',a='';v.split('|').forEach(function(x){x=x.trim();var m=x.match(/^Hours:\s*(.*)/i);if(m)h=m[1];m=x.match(/^Rate:\s*(.*)/i);if(m)r=m[1];m=x.match(/^Amount:\s*(.*)/i);if(m)a=m[1]});return['Labour',h?h+' hrs':'',r,a]})(d.labour_details));if(!rows.length)rows=[['No item breakdown supplied.','','','']];$('app').innerHTML='<div class="head"><div><div class="eyebrow">TRADIE QUOTE BUDDY</div><div class="brand">'+esc(d.business_name)+'</div><div class="muted">'+esc(d.business_address)+'<br>'+esc(d.business_phone)+'<br>'+esc(d.business_email)+'</div></div><div class="meta"><div class="eyebrow">QUOTE</div><div class="quote-no">'+esc(d.quote_number)+'</div><div class="muted">Pending</div></div></div><div class="section customer"><h3>CUSTOMER</h3><b>'+esc(d.customer_name)+'</b><br>'+esc(d.customer_phone)+'<br>'+esc(d.customer_email)+'<br>'+esc(d.customer_address)+'</div><div class="section job"><h3>JOB DESCRIPTION</h3>'+esc(d.job_description||'No job description supplied.')+'</div><div class="section table-wrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'}).join('')+'</tbody></table></div><div class="totals"><div><span>Subtotal</span><span>'+esc(d.subtotal)+'</span></div>'+((d.discount&&d.discount!=='None')?'<div><span>Discount</span><span>'+esc(d.discount)+'</span></div>':'')+'<div><span>GST</span><span>'+esc(d.gst)+'</span></div><div class="grand"><span>Total</span><span>'+esc(d.total||d.quote_total)+'</span></div></div><div class="actions"><a class="accept" href="'+acceptUrl+'">✓ Accept Quote</a><a class="decline" href="'+declineUrl+'">✕ Decline Quote</a><button class="pdf" id="downloadPdf">📄 Download PDF</button></div><div class="note">Review the quote above. You can download a PDF for your records, or use Accept Quote / Decline Quote to send your decision to the business. No payment is taken when you respond.</div>';$('downloadPdf').onclick=function(){var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=16,W=210,H=297,y=M,C=W-M*2;function wrap(t,x,w,size,b){doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(size||10);var a=doc.splitTextToSize(clean(t),w);doc.text(a,x,y);y+=a.length*((size||10)*.42)+2}function ensure(h){if(y+h>H-M){doc.addPage();y=M}}doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('TRADIE QUOTE BUDDY',M,y);y+=7;doc.setFontSize(19);doc.text(clean(d.business_name),M,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text([d.business_address,d.business_phone,d.business_email].filter(Boolean).join('\n'),M,y);var rx=W-M-55;doc.setFont('helvetica','bold');doc.text('QUOTE',rx,y-6);doc.setFontSize(17);doc.text(clean(d.quote_number),rx,y+1);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Pending',rx,y+8);y+=22;doc.line(M,y,W-M,y);y+=8;wrap('CUSTOMER',M,C,9,true);wrap(d.customer_name,M,C,11,true);wrap([d.customer_phone,d.customer_email,d.customer_address].filter(Boolean).join('\n'),M,C,9,false);y+=3;wrap('JOB DESCRIPTION',M,C,9,true);wrap(d.job_description||'No job description supplied.',M,C,10,false);y+=3;ensure(45);wrap('MATERIALS & OTHER COSTS',M,C,9,true);doc.autoTable({startY:y,margin:{left:M,right:M},head:[['Description','Qty','Unit','Amount']],body:rows,theme:'grid',styles:{font:'helvetica',fontSize:8,cellPadding:2.5},headStyles:{fontStyle:'bold',fillColor:[35,35,35],textColor:[255,255,255]},columnStyles:{0:{cellWidth:92},1:{cellWidth:24,halign:'right'},2:{cellWidth:30,halign:'right'},3:{cellWidth:32,halign:'right'}}});y=doc.lastAutoTable.finalY+8;ensure(42);var tx=W-M-70;doc.setFontSize(9);function tr(l,v,b){doc.setFont('helvetica',b?'bold':'normal');doc.text(l,tx,y);doc.text(clean(v),W-M,y,{align:'right'});y+=6}tr('Subtotal',d.subtotal,false);if(d.discount&&d.discount!=='None')tr('Discount',d.discount,false);tr('GST',d.gst,false);doc.line(tx,y-2,W-M,y-2);y+=3;doc.setFontSize(12);tr('TOTAL',d.total||d.quote_total,true);ensure(30);y+=8;doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('CUSTOMER RESPONSE',M,y);y+=7;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Use the buttons below in the quote email to respond.',M,y);doc.save('Quote-'+clean(d.quote_number)+'.pdf')};})();</script></body></html>
