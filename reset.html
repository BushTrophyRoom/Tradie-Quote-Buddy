<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DustyBoots Update</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}main{max-width:420px}h1{color:#ffb000}p{color:#ccc;line-height:1.5}</style></head><body><main><h1>Updating DustyBoots…</h1><p>Refreshing the app engine. Your quotes and business data are not being deleted.</p></main><script>(async function(){try{if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister()}))}if(window.caches){var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k)}))}}catch(e){}location.replace('./?dustyboots-fresh='+Date.now())})();</script></body></html>
