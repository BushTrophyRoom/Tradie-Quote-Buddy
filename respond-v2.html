<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Quote Response • Tradie Quote Buddy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:560px;background:#fff;border-radius:18px;box-shadow:0 4px 22px #0002;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:48px;height:48px;border-radius:12px;background:#171717;color:#ffb000;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:18px}.brand span{display:block;font-size:12px;color:#777;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b66e00;font-weight:800}.title{font-size:28px;margin:5px 0 8px}.intro{color:#555;line-height:1.5}.summary{margin:22px 0;padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.summary div{display:flex;justify-content:space-between;gap:20px;padding:6px 0}.summary div span:first-child{color:#666}.summary div span:last-child{font-weight:700;text-align:right}.status{margin-top:20px;padding:16px;border-radius:12px;font-weight:700;line-height:1.5}.working{background:#f3f4f6;color:#444}.success{background:#eaf7ee;color:#176b36}.error{background:#fff0f0;color:#a21b1b}.small{font-size:12px;color:#777;margin-top:18px;line-height:1.5}.fallback{display:inline-block;margin-top:12px;color:#8b4f00;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<main class="card"><div class="brand"><div class="brand-mark">🔨</div><div><strong>Tradie Quote Buddy</strong><span>Quote response</span></div></div><div class="eyebrow">CUSTOMER RESPONSE</div><h1 class="title" id="title">Processing your response…</h1><p class="intro" id="intro">Please wait while we send your response to the business.</p><div class="summary" id="summary"></div><div class="status working" id="status">Sending response…</div><p class="small" id="small">You are not being charged or asked for payment. This page only records your quote decision.</p></main>
<script>
(function(){'use strict';
var EMAILJS_PUBLIC_KEY='dyBjG4ATAJjl1LYSQ',EMAILJS_SERVICE_ID='service_wmpq4cq',EMAILJS_TEMPLATE_ID='template_hif99a6',SUPABASE_FUNCTION_URL='https://cychngcvhgtfuahavlqq.supabase.co/functions/v1/create-quote-pdf';
function $(id){return document.getElementById(id)}
function decodeData(value){try{var p=value.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}
function setStatus(type,title,text){var e=$('status');e.className='status '+type;e.innerHTML='<b>'+esc(title)+'</b><br>'+esc(text)}
function clean(v){return String(v==null?'':v).replace(/\r/g,'').trim()}
function splitLines(v){return clean(v).split(/\n+/).map(function(x){return x.trim()}).filter(Boolean)}
function parseItemLine(line){var parts=line.split('|').map(function(x){return x.trim()});if(parts.length>=4){var desc=parts[0].replace(/^Description\s*:\s*/i,'');var qty=(parts[1].match(/Qty\s*:\s*(.*)/i)||[])[1]||'';var unit=(parts[2].match(/Unit\s*:\s*(.*)/i)||[])[1]||'';var amount=(parts[3].match(/Amount\s*:\s*(.*)/i)||[])[1]||'';return [desc,qty,unit,amount]}return [line,'','','']}
function parseLabourLine(line){var parts=line.split('|').map(function(x){return x.trim()}),hours='',rate='',amount='';for(var i=0;i<parts.length;i++){var m=parts[i].match(/^Hours\s*:\s*(.*)$/i);if(m)hours=m[1].trim();m=parts[i].match(/^Rate\s*:\s*(.*)$/i);if(m)rate=m[1].trim();m=parts[i].match(/^Amount\s*:\s*(.*)$/i);if(m)amount=m[1].trim()}return ['Labour',hours?hours+' hrs':'',rate,amount]}
function money(v){return clean(v)}
function makePdf(d){
  if(!window.jspdf||!window.jspdf.jsPDF)return Promise.reject(new Error('PDF library unavailable'));
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'}),M=16,W=210,H=297,C=W-M*2,y=M;
  var decision=String(d.decision||d.quote_status||'').toLowerCase()==='accepted'?'Accepted':'Declined';
  function wrap(text,x,maxW,size,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size||10);var lines=doc.splitTextToSize(clean(text),maxW);doc.text(lines,x,y);y+=lines.length*((size||10)*.42)+2}
  function ensure(h){if(y+h>H-M){doc.addPage();y=M}}
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('TRADIE QUOTE BUDDY',M,y);y+=8;doc.setFontSize(19);doc.text(clean(d.business_name||'Tradie Quote Buddy'),M,y);doc.setFont('helvetica','normal');doc.setFontSize(9);y+=6;
  var business=[d.business_address,d.business_phone,d.business_email].map(clean).filter(Boolean).join('\n');if(business)doc.text(doc.splitTextToSize(business,C*.58),M,y);
  var rx=W-M-55;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('QUOTE',rx,y-6);doc.setFontSize(17);doc.text(clean(d.quote_number),rx,y+1);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(clean(d.responded_at||''),rx,y+7);doc.setFont('helvetica','bold');doc.text(decision,rx,y+13);y+=20;doc.line(M,y,W-M,y);y+=8;
  ensure(25);wrap('CUSTOMER',M,C,9,true);wrap(clean(d.customer_name),M,C,11,true);var cust=[d.customer_phone,d.customer_email,d.customer_address].map(clean).filter(Boolean).join('\n');if(cust)wrap(cust,M,C,9,false);y+=3;
  ensure(25);wrap('JOB DESCRIPTION',M,C,9,true);wrap(d.job_description||'No job description supplied.',M,C,10,false);y+=3;
  ensure(45);wrap('MATERIALS & OTHER COSTS',M,C,9,true);var rawLines=splitLines(d.materials_details||d.item_details||''),rows=[];rawLines.forEach(function(line){if(!/^materials\s*&\s*other\s*costs$/i.test(line))rows.push(parseItemLine(line))});if(d.labour_details)rows.push(parseLabourLine(clean(d.labour_details)));if(!rows.length)rows=[['No item breakdown supplied.','','','']];
  if(typeof doc.autoTable==='function'){doc.autoTable({startY:y,margin:{left:M,right:M},head:[['Description','Qty','Unit','Amount']],body:rows,theme:'grid',styles:{font:'helvetica',fontSize:8,cellPadding:2.5,textColor:[23,23,23]},headStyles:{fontStyle:'bold',fillColor:[35,35,35],textColor:[255,255,255]},columnStyles:{0:{cellWidth:92},1:{cellWidth:24,halign:'right'},2:{cellWidth:30,halign:'right'},3:{cellWidth:32,halign:'right'}},didDrawPage:function(){doc.setFontSize(7);doc.setFont('helvetica','normal');doc.text('Tradie Quote Buddy • '+clean(d.quote_number),M,H-8)}});y=doc.lastAutoTable.finalY+8}else rows.forEach(function(r){ensure(8);wrap(r.join(' | '),M,C,8,false)});
  ensure(55);var tx=W-M-70;doc.setFont('helvetica','normal');doc.setFontSize(9);function tr(label,val,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.text(label,tx,y);doc.text(money(val),W-M,y,{align:'right'});y+=6}tr('Subtotal',d.subtotal,false);if(clean(d.discount)&&clean(d.discount)!=='$0.00'&&clean(d.discount)!=='0'&&clean(d.discount)!=='None')tr('Discount',d.discount,false);tr('GST',d.gst,false);doc.line(tx,y-2,W-M,y-2);y+=3;doc.setFontSize(12);tr('TOTAL',d.total||d.quote_total,true);ensure(28);y+=8;doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('QUOTE STATUS',M,y);y+=5;wrap(decision+' • Response recorded '+clean(d.responded_at||''),M,C,9,false);y+=8;doc.setFontSize(8);doc.setTextColor(100,100,100);doc.text('Thank you for the opportunity to quote on your job.',M,y);doc.setTextColor(23,23,23);
  return Promise.resolve(doc.output('datauristring'));
}
function emailParams(d,responsePageUrl,pdfUrl){return{quote_number:d.quote_number,business_name:d.business_name,business_email:d.business_email,customer_name:d.customer_name,customer_phone:d.customer_phone,customer_email:d.customer_email,customer_address:d.customer_address,job_description:d.job_description,item_details:d.item_details,materials_details:d.materials_details,labour_details:d.labour_details,subtotal:d.subtotal,discount:d.discount,gst:d.gst,total:d.total,quote_total:d.quote_total||d.total,decision:d.decision,quote_status:d.quote_status||d.decision,response_token:d.response_token,responded_at:d.responded_at,quote_pdf:pdfUrl||responsePageUrl,response_link:responsePageUrl}}
function sendBusinessEmail(d,responsePageUrl,pdfUrl){return emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,emailParams(d,responsePageUrl,pdfUrl))}
var data=decodeData(new URLSearchParams(location.search).get('data')||'');
if(!data||!data.quote_number||!data.decision){$('title').textContent='Invalid response link';$('intro').textContent='This quote response link is missing information or has expired.';setStatus('error','Response not sent','Please contact the business directly.');return}
var accepted=String(data.decision).toLowerCase()==='accepted',responsePageUrl=location.href;$('title').textContent=accepted?'Quote accepted':'Quote declined';$('intro').textContent=accepted?'Thanks. Your acceptance is being sent to the business now.':'Thanks. Your decision is being sent to the business now.';$('summary').innerHTML='<div><span>Quote</span><span>'+esc(data.quote_number)+'</span></div><div><span>Customer</span><span>'+esc(data.customer_name)+'</span></div><div><span>Total</span><span>'+esc(data.total||data.quote_total)+'</span></div><div><span>Decision</span><span>'+esc(data.decision)+'</span></div>';
if(!String(data.business_email||'').trim()){setStatus('error','Business email is missing','Open Business Settings, add the owner email, save it, and generate the response link again.');return}
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY,blockHeadless:true,limitRate:{id:'quote-response',throttle:1000}});setStatus('working','Sending response','We are notifying the business now.');
makePdf(data).then(function(pdfDataUri){
  return fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdfDataUri:pdfDataUri,quoteNumber:data.quote_number,responseToken:data.response_token,decision:data.decision,customerName:data.customer_name})}).then(function(r){return r.text().then(function(text){var x={};try{x=JSON.parse(text)}catch(e){}if(!r.ok||!x.pdfUrl)throw new Error(x.error||('Secure PDF service returned HTTP '+r.status));return x.pdfUrl})}).then(function(pdfUrl){return sendBusinessEmail(data,responsePageUrl,pdfUrl).then(function(){return{pdfUrl:pdfUrl}})});
}).then(function(result){setStatus('success',accepted?'Acceptance sent':'Decline sent',accepted?'The business has been notified that you accepted quote '+data.quote_number+'. The response PDF link is included.':'The business has been notified that you declined quote '+data.quote_number+'. The response PDF link is included.');$('small').textContent='Your response has been recorded. You can now close this page.'}).catch(function(primaryError){
  console.warn('Secure PDF/primary send failed, using email fallback:',primaryError);
  sendBusinessEmail(data,responsePageUrl,'').then(function(){
    setStatus('success',accepted?'Acceptance sent':'Decline sent',accepted?'The business has been notified that you accepted quote '+data.quote_number+'. The online response page is included in the email.':'The business has been notified that you declined quote '+data.quote_number+'. The online response page is included in the email.');$('small').textContent='Your response was sent successfully. The secure PDF service was unavailable, but the business has been notified.';
  }).catch(function(emailError){
    console.error('Email fallback failed:',emailError);setStatus('error','Automatic email failed','Please contact the business directly and tell them you '+(accepted?'accept':'decline')+' quote '+data.quote_number+'.');var s=encodeURIComponent('Quote '+data.quote_number+' '+data.decision),b=encodeURIComponent('Quote '+data.quote_number+'\nCustomer: '+data.customer_name+'\nDecision: '+data.decision+'\nTotal: '+(data.total||data.quote_total)+'\nResponse page: '+responsePageUrl);$('small').innerHTML='If needed, <a class="fallback" href="mailto:'+encodeURIComponent(data.business_email)+'?subject='+s+'&body='+b+'">email the business manually</a>.';
  });
});
})();
</script>
</body>
</html>
