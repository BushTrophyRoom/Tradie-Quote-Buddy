<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Quote Response • Tradie Quote Buddy</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:560px;background:#fff;border-radius:18px;box-shadow:0 4px 22px #0002;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:48px;height:48px;border-radius:12px;background:#171717;color:#ffb000;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:18px}.brand span{display:block;font-size:12px;color:#777;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b66e00;font-weight:800}.title{font-size:28px;margin:5px 0 8px}.intro{color:#555;line-height:1.5}.summary{margin:22px 0;padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.summary div{display:flex;justify-content:space-between;gap:20px;padding:6px 0}.summary div span:first-child{color:#666}.summary div span:last-child{font-weight:700;text-align:right}.status{margin-top:20px;padding:16px;border-radius:12px;font-weight:700;line-height:1.5}.working{background:#f3f4f6;color:#444}.success{background:#eaf7ee;color:#176b36}.error{background:#fff0f0;color:#a21b1b}.small{font-size:12px;color:#777;margin-top:18px;line-height:1.5}.fallback{display:inline-block;margin-top:12px;color:#8b4f00;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script></head><body><main class="card"><div class="brand"><div class="brand-mark">🔨</div><div><strong>Tradie Quote Buddy</strong><span>Quote response</span></div></div><div class="eyebrow">CUSTOMER RESPONSE</div><h1 class="title" id="title">Processing your response…</h1><p class="intro" id="intro">Please wait while we record your decision.</p><div class="summary" id="summary"></div><div class="status working" id="status">Recording response…</div><p class="small" id="small">You are not being charged or asked for payment.</p></main><script>(function(){'use strict';var KEY='dyBjG4ATAJjl1LYSQ',SERVICE='service_wmpq4cq',TEMPLATE='template_hif99a6',ENDPOINT='https://cychngcvhgtfuahavlqq.supabase.co/functions/v1/create-quote-pdf';function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).trim()}function dec(v){try{var p=v.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}function esc(v){return clean(v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}function status(t,h,m){var e=$('status');e.className='status '+t;e.innerHTML='<b>'+esc(h)+'</b><br>'+esc(m)}function params(d){return{quote_number:d.quote_number,business_name:d.business_name,business_email:d.business_email,customer_name:d.customer_name,customer_phone:d.customer_phone,customer_email:d.customer_email,customer_address:d.customer_address,job_description:d.job_description,item_details:d.item_details,materials_details:d.materials_details,labour_details:d.labour_details,subtotal:d.subtotal,discount:d.discount,gst:d.gst,total:d.total,quote_total:d.quote_total||d.total,decision:d.decision,quote_status:d.decision,response_token:d.response_token,responded_at:d.responded_at,quote_pdf:location.href,response_link:location.href}}function email(d){return emailjs.send(SERVICE,TEMPLATE,params(d))}var d=dec(new URLSearchParams(location.search).get('data')||'');if(!d||!d.quote_number||!d.decision){$('title').textContent='Invalid response link';$('intro').textContent='This quote response link is missing information.';status('error','Response not sent','Please contact the business directly.');return}var accepted=clean(d.decision).toLowerCase()==='accepted';$('title').textContent=accepted?'Quote accepted':'Quote declined';$('intro').textContent=accepted?'Thanks. Your acceptance is being recorded and sent to the business now.':'Thanks. Your decision is being recorded and sent to the business now.';$('summary').innerHTML='<div><span>Quote</span><span>'+esc(d.quote_number)+'</span></div><div><span>Customer</span><span>'+esc(d.customer_name)+'</span></div><div><span>Total</span><span>'+esc(d.total||d.quote_total)+'</span></div><div><span>Decision</span><span>'+esc(d.decision)+'</span></div>';if(!clean(d.business_email)){status('error','Business email is missing','The business needs to add an email address in Business Settings.');return}emailjs.init({publicKey:KEY,blockHeadless:true,limitRate:{id:'quote-response',throttle:1000}});status('working','Recording response','Saving your decision securely.');var recordUrl=ENDPOINT+'?action=record&quoteNumber='+encodeURIComponent(d.quote_number)+'&responseToken='+encodeURIComponent(d.response_token)+'&decision='+encodeURIComponent(d.decision)+'&customerName='+encodeURIComponent(d.customer_name);fetch(recordUrl,{method:'GET',cache:'no-store'}).then(function(r){return r.text().then(function(t){var x={};try{x=JSON.parse(t)}catch(e){}if(!r.ok||!x.success)throw new Error(x.error||('Response service returned HTTP '+r.status));return x})}).then(function(x){return email(d).then(function(){return x})}).then(function(x){status('success',accepted?'Acceptance sent':'Decline sent',accepted?'Your acceptance has been recorded and the business has been notified.':'Your decision has been recorded and the business has been notified.');$('small').textContent='Your response is safely recorded. The business has been notified. You can now close this page.'}).catch(function(e){console.error(e);status('error','Automatic response failed','Please contact the business directly and tell them you '+(accepted?'accept':'decline')+' quote '+d.quote_number+'.');var s=encodeURIComponent('Quote '+d.quote_number+' '+d.decision),b=encodeURIComponent('Quote '+d.quote_number+'\nCustomer: '+d.customer_name+'\nDecision: '+d.decision+'\nTotal: '+(d.total||d.quote_total)+'\nResponse page: '+location.href);$('small').innerHTML='<a class="fallback" href="mailto:'+encodeURIComponent(d.business_email)+'?subject='+s+'&body='+b+'">Email the business manually</a> if needed.'})})();</script></body></html>
