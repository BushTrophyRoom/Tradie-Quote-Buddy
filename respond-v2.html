<main class="card"><div class="brand"><div class="brand-mark">🔨</div><div><strong>Tradie Quote Buddy</strong><span>Quote response</span></div></div><div class="eyebrow">CUSTOMER RESPONSE</div><h1 class="title" id="title">Processing your response…</h1><p class="intro" id="intro">Please wait while we send your response to the business.</p><div class="summary" id="summary"></div><div class="status working" id="status">Sending response…</div><p class="small" id="small">You are not being charged or asked for payment. This page only records your quote decision.</p></main><div id="pdfDocument" aria-hidden="true"></div>
<script>
(function(){'use strict';
var EMAILJS_PUBLIC_KEY='dyBjG4ATAJjl1LYSQ',EMAILJS_SERVICE_ID='service_wmpq4cq',EMAILJS_TEMPLATE_ID='template_hif99a6',SUPABASE_FUNCTION_URL='https://cychngcvhgtfuahavlqq.supabase.co/functions/v1/create-quote-pdf';
function $(id){return document.getElementById(id)}
function decodeData(value){try{var p=value.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}
function setStatus(type,title,text){var e=$('status');e.className='status '+type;e.innerHTML='<b>'+esc(title)+'</b><br>'+esc(text)}
function fmt(v){return esc(v||'').replace(/\r?\n/g,'<br>')}
function buildPdfHtml(d){var lines=[];String(d.materials_details||d.item_details||'').split(/\r?\n/).forEach(function(x){if(x.trim())lines.push(x)});var rows='';lines.forEach(function(x){rows+='<tr><td>'+esc(x)+'</td><td></td><td></td><td></td></tr>'});if(d.labour_details)rows+='<tr><td>'+esc(d.labour_details)+'</td><td></td><td></td><td></td></tr>';if(!rows)rows='<tr><td colspan="4">No item breakdown supplied.</td></tr>';var disc=d.discount&&d.discount!=='$0.00'&&d.discount!=='0'?'<div><span>Discount</span><span>'+esc(d.discount)+'</span></div>':'';var decision=String(d.decision||d.quote_status||'').toLowerCase()==='accepted'?'Accepted':'Declined';return '<div class="pdf-head"><div><div class="pdf-label">TRADIE QUOTE BUDDY</div><h1>'+esc(d.business_name||'Tradie Quote Buddy')+'</h1><div>'+fmt(d.business_address)+'</div><div>'+esc(d.business_phone||'')+'</div><div>'+esc(d.business_email||'')+'</div></div><div class="pdf-meta"><div class="pdf-label">QUOTE</div><h2>'+esc(d.quote_number)+'</h2><div>'+esc(d.responded_at||'')+'</div><div><b>'+decision+'</b></div></div></div><div class="customer"><b>Customer</b><div>'+esc(d.customer_name)+'</div><div>'+esc(d.customer_phone)+'</div><div>'+esc(d.customer_email)+'</div><div>'+fmt(d.customer_address)+'</div></div><div class="job"><b>Job description</b><br>'+fmt(d.job_description)+'</div><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="totals"><div><span>Subtotal</span><span>'+esc(d.subtotal||'')+'</span></div>'+disc+'<div><span>GST</span><span>'+esc(d.gst||'')+'</span></div><div class="grand"><span>Total</span><span>'+esc(d.total||d.quote_total||'')+'</span></div></div><div class="terms"><b>Quote status:</b> '+decision+'<br><b>Response recorded:</b> '+esc(d.responded_at||'')+'</div><div class="thanks">Thank you for the opportunity to quote on your job.</div>'}
function makePdf(d){
  var el=$('pdfDocument');
  el.innerHTML=buildPdfHtml(d);
  if(!window.html2pdf)return Promise.reject(new Error('PDF library unavailable'));
  el.style.display='block';
  el.style.position='fixed';
  el.style.left='0';
  el.style.top='0';
  el.style.zIndex='99999';
  return new Promise(function(resolve){
    requestAnimationFrame(function(){requestAnimationFrame(resolve);});
  }).then(function(){
    return html2pdf().set({margin:[0.35,0.35,0.35,0.35],image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff',scrollX:0,scrollY:0},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}}).from(el).outputPdf('datauristring');
  }).then(function(pdf){
    el.innerHTML='';
    el.style.display='none';
    return pdf;
  },function(error){
    el.innerHTML='';
    el.style.display='none';
    throw error;
  });
}
var data=decodeData(new URLSearchParams(location.search).get('data')||'');if(!data||!data.quote_number||!data.decision){$('title').textContent='Invalid response link';$('intro').textContent='This quote response link is missing information or has expired.';setStatus('error','Response not sent','Please contact the business directly.');return}
var accepted=String(data.decision).toLowerCase()==='accepted';$('title').textContent=accepted?'Quote accepted':'Quote declined';$('intro').textContent=accepted?'Thanks. Your acceptance is being sent to the business now.':'Thanks. Your decision is being sent to the business now.';$('summary').innerHTML='<div><span>Quote</span><span>'+esc(data.quote_number)+'</span></div><div><span>Customer</span><span>'+esc(data.customer_name)+'</span></div><div><span>Total</span><span>'+esc(data.total||data.quote_total)+'</span></div><div><span>Decision</span><span>'+esc(data.decision)+'</span></div>';
if(!String(data.business_email||'').trim()){setStatus('error','Business email is missing','Open Business Settings, add the owner email, save it, and generate the response link again.');return}
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY,blockHeadless:true,limitRate:{id:'quote-response',throttle:1000}});setStatus('working','Preparing secure quote PDF','Creating the PDF and storing it securely.');
makePdf(data).then(function(pdfDataUri){return fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdfDataUri:pdfDataUri,quoteNumber:data.quote_number,responseToken:data.response_token})}).then(function(r){return r.json().then(function(x){if(!r.ok||!x.pdfUrl)throw new Error(x.error||'Could not create secure PDF link');return x.pdfUrl})}).then(function(pdfUrl){return emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{quote_number:data.quote_number,business_name:data.business_name,business_email:data.business_email,customer_name:data.customer_name,customer_phone:data.customer_phone,customer_email:data.customer_email,customer_address:data.customer_address,job_description:data.job_description,item_details:data.item_details,materials_details:data.materials_details,labour_details:data.labour_details,subtotal:data.subtotal,discount:data.discount,gst:data.gst,total:data.total,quote_total:data.quote_total||data.total,decision:data.decision,quote_status:data.quote_status||data.decision,response_token:data.response_token,responded_at:data.responded_at,quote_pdf:pdfUrl})})}).then(function(){setStatus('success',accepted?'Acceptance sent':'Decline sent',accepted?'The business has been notified that you accepted quote '+data.quote_number+'. The email contains a secure PDF link.':'The business has been notified that you declined quote '+data.quote_number+'. The email contains a secure PDF link.');$('small').textContent='Your response has been recorded. You can now close this page.'}).catch(function(error){console.error(error);setStatus('error','We could not send the response automatically','Please contact the business directly and tell them you '+(accepted?'accept':'decline')+' quote '+data.quote_number+'.');if(data.business_email){var s=encodeURIComponent('Quote '+data.quote_number+' '+data.decision),b=encodeURIComponent('Quote '+data.quote_number+'\nCustomer: '+data.customer_name+'\nDecision: '+data.decision+'\nTotal: '+(data.total||data.quote_total));$('small').innerHTML='If needed, <a class="fallback" href="mailto:'+encodeURIComponent(data.business_email)+'?subject='+s+'&body='+b+'">email the business manually</a>.'}})
})();
</script></body></html>
