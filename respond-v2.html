<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:560px;background:#fff;border-radius:18px;box-shadow:0 4px 22px #0002;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:48px;height:48px;border-radius:12px;background:#171717;color:#ffb000;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:18px}.brand span{display:block;font-size:12px;color:#777;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b66e00;font-weight:800}.title{font-size:28px;margin:5px 0 8px}.intro{color:#555;line-height:1.5}.summary{margin:22px 0;padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.summary div{display:flex;justify-content:space-between;gap:20px;padding:6px 0}.summary div span:first-child{color:#666}.summary div span:last-child{font-weight:700;text-align:right}.status{margin-top:20px;padding:16px;border-radius:12px;font-weight:700;line-height:1.5}.working{background:#f3f4f6;color:#444}.success{background:#eaf7ee;color:#176b36}.error{background:#fff0f0;color:#a21b1b}.small{font-size:12px;color:#777;margin-top:18px;line-height:1.5}.fallback{display:inline-block;margin-top:12px;color:#8b4f00;font-weight:700}

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<body>
<main class="card"><div class="brand"><div class="brand-mark">🔨</div><div><strong>Tradie Quote Buddy</strong><span>Quote response</span></div></div><div class="eyebrow">CUSTOMER RESPONSE</div><h1 class="title" id="title">Processing your response…</h1><p class="intro" id="intro">Please wait while we send your response to the business.</p><div class="summary" id="summary"></div><div class="status working" id="status">Sending response…</div><p class="small" id="small">You are not being charged or asked for payment. This page only records your quote decision.</p></main>
<script>
(function(){'use strict';
var EMAILJS_PUBLIC_KEY='dyBjG4ATAJjl1LYSQ',EMAILJS_SERVICE_ID='service_wmpq4cq',EMAILJS_TEMPLATE_ID='template_hif99a6',SUPABASE_FUNCTION_URL='https://cychngcvhgtfuahavlqq.supabase.co/functions/v1/create-quote-pdf';
function $(id){return document.getElementById(id)}
function decodeData(value){try{var p=value.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[c]})}
function setStatus(type,title,text){var e=$('status');e.className='status '+type;e.innerHTML='<b>'+esc(title)+'</b><br>'+esc(text)}
function clean(v){return String(v==null?'':v).replace(/\r/g,'').trim()}
function splitLines(v){return clean(v).split(/\n+/).map(function(x){return x.trim()}).filter(Boolean)}
function parseItemLine(line){var parts=line.split('|').map(function(x){return x.trim()});if(parts.length>=4){var desc=parts[0].replace(/^Description\s*:\s*/i,'');var qty=(parts[1].match(/Qty\s*:\s*(.*)/i)||[])[1]||'';var unit=(parts[2].match(/Unit\s*:\s*(.*)/i)||[])[1]||'';var amount=(parts[3].match(/Amount\s*:\s*(.*)/i)||[])[1]||'';return [desc,qty,unit,amount]}return [line,'','','']}
function money(v){return clean(v)}
function makePdf(d){
  if(!window.jspdf||!window.jspdf.jsPDF) return Promise.reject(new Error('PDF library unavailable'));
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  var margin=16,pageW=210,pageH=297,contentW=pageW-margin*2,y=margin;
  var decision=String(d.decision||d.quote_status||'').toLowerCase()==='accepted'?'Accepted':'Declined';
  function addWrapped(text,x,maxW,size,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size||10);var lines=doc.splitTextToSize(clean(text),maxW);doc.text(lines,x,y);y+=lines.length*((size||10)*0.42)+2;return lines.length}
  function ensure(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('TRADIE QUOTE BUDDY',margin,y);doc.setFontSize(19);y+=8;doc.text(clean(d.business_name||'Tradie Quote Buddy'),margin,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);y+=6;
  var business=[d.business_address,d.business_phone,d.business_email].map(clean).filter(Boolean).join('\n');
  if(business){var bl=doc.splitTextToSize(business,contentW*0.58);doc.text(bl,margin,y)}
  var rightX=pageW-margin-55;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('QUOTE',rightX,y-6);doc.setFontSize(17);doc.text(clean(d.quote_number),rightX,y+1);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(clean(d.responded_at||''),rightX,y+7);doc.setFont('helvetica','bold');doc.text(decision,rightX,y+13);
  y+=20;doc.setLineWidth(.5);doc.line(margin,y,pageW-margin,y);y+=8;
  ensure(25);addWrapped('CUSTOMER',margin,contentW,9,true);addWrapped(clean(d.customer_name),margin,contentW,11,true);var cust=[d.customer_phone,d.customer_email,d.customer_address].map(clean).filter(Boolean).join('\n');if(cust)addWrapped(cust,margin,contentW,9,false);y+=3;
  ensure(25);addWrapped('JOB DESCRIPTION',margin,contentW,9,true);addWrapped(d.job_description||'No job description supplied.',margin,contentW,10,false);y+=3;
  ensure(45);addWrapped('MATERIALS & OTHER COSTS',margin,contentW,9,true);
  var rawLines=splitLines(d.materials_details||d.item_details||''),rows=[];rawLines.forEach(function(line){if(!/^materials\s*&\s*other\s*costs$/i.test(line))rows.push(parseItemLine(line))});
  if(d.labour_details)rows.push(['Labour',clean(d.labour_details).replace(/^Labour\s*\|\s*/i,''),'','']);
  if(!rows.length)rows=[['No item breakdown supplied.','','','']];
  if(typeof doc.autoTable==='function'){
    doc.autoTable({startY:y,margin:{left:margin,right:margin},head:[['Description','Qty','Unit','Amount']],body:rows,theme:'grid',styles:{font:'helvetica',fontSize:8,cellPadding:2.5,textColor:[23,23,23]},headStyles:{fontStyle:'bold',fillColor:[35,35,35],textColor:[255,255,255]},columnStyles:{0:{cellWidth:92},1:{cellWidth:24,halign:'right'},2:{cellWidth:30,halign:'right'},3:{cellWidth:32,halign:'right'}},didDrawPage:function(){doc.setFontSize(7);doc.setFont('helvetica','normal');doc.text('Tradie Quote Buddy • '+clean(d.quote_number),margin,pageH-8)}});
    y=doc.lastAutoTable.finalY+8;
  }else{rows.forEach(function(r){ensure(8);addWrapped(r.join(' | '),margin,contentW,8,false)})}
  ensure(55);var totalsX=pageW-margin-70;doc.setFont('helvetica','normal');doc.setFontSize(9);
  function totalRow(label,val,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.text(label,totalsX,y);doc.text(money(val),pageW-margin,y,{align:'right'});y+=6}
  totalRow('Subtotal',d.subtotal,false);if(clean(d.discount)&&clean(d.discount)!=='$0.00'&&clean(d.discount)!=='0')totalRow('Discount',d.discount,false);totalRow('GST',d.gst,false);doc.setLineWidth(.6);doc.line(totalsX,y-2,pageW-margin,y-2);y+=3;doc.setFontSize(12);totalRow('TOTAL',d.total||d.quote_total,true);
  ensure(28);y+=8;doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('QUOTE STATUS',margin,y);doc.setFont('helvetica','normal');y+=5;addWrapped(decision+' • Response recorded '+clean(d.responded_at||''),margin,contentW,9,false);y+=8;doc.setFontSize(8);doc.setTextColor(100,100,100);doc.text('Thank you for the opportunity to quote on your job.',margin,y);doc.setTextColor(23,23,23);
  return Promise.resolve(doc.output('datauristring'));
}
var data=decodeData(new URLSearchParams(location.search).get('data')||'');
if(!data||!data.quote_number||!data.decision){$('title').textContent='Invalid response link';$('intro').textContent='This quote response link is missing information or has expired.';setStatus('error','Response not sent','Please contact the business directly.');return}
var accepted=String(data.decision).toLowerCase()==='accepted';$('title').textContent=accepted?'Quote accepted':'Quote declined';$('intro').textContent=accepted?'Thanks. Your acceptance is being sent to the business now.':'Thanks. Your decision is being sent to the business now.';$('summary').innerHTML='<div><span>Quote</span><span>'+esc(data.quote_number)+'</span></div><div><span>Customer</span><span>'+esc(data.customer_name)+'</span></div><div><span>Total</span><span>'+esc(data.total||data.quote_total)+'</span></div><div><span>Decision</span><span>'+esc(data.decision)+'</span></div>';
if(!String(data.business_email||'').trim()){setStatus('error','Business email is missing','Open Business Settings, add the owner email, save it, and generate the response link again.');return}
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY,blockHeadless:true,limitRate:{id:'quote-response',throttle:1000}});setStatus('working','Preparing secure quote PDF','Creating the PDF and storing it securely.');
makePdf(data).then(function(pdfDataUri){return fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdfDataUri:pdfDataUri,quoteNumber:data.quote_number,responseToken:data.response_token})}).then(function(r){return r.json().then(function(x){if(!r.ok||!x.pdfUrl)throw new Error(x.error||'Could not create secure PDF link');return x.pdfUrl})}).then(function(pdfUrl){return emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{quote_number:data.quote_number,business_name:data.business_name,business_email:data.business_email,customer_name:data.customer_name,customer_phone:data.customer_phone,customer_email:data.customer_email,customer_address:data.customer_address,job_description:data.job_description,item_details:data.item_details,materials_details:data.materials_details,labour_details:data.labour_details,subtotal:data.subtotal,discount:data.discount,gst:data.gst,total:data.total,quote_total:data.quote_total||data.total,decision:data.decision,quote_status:data.quote_status||data.decision,response_token:data.response_token,responded_at:data.responded_at,quote_pdf:pdfUrl})})}).then(function(){setStatus('success',accepted?'Acceptance sent':'Decline sent',accepted?'The business has been notified that you accepted quote '+data.quote_number+'. The email contains a secure PDF link.':'The business has been notified that you declined quote '+data.quote_number+'. The email contains a secure PDF link.');$('small').textContent='Your response has been recorded. You can now close this page.'}).catch(function(error){console.error(error);setStatus('error','We could not send the response automatically','Please contact the business directly and tell them you '+(accepted?'accept':'decline')+' quote '+data.quote_number+'.');if(data.business_email){var s=encodeURIComponent('Quote '+data.quote_number+' '+data.decision),b=encodeURIComponent('Quote '+data.quote_number+'\nCustomer: '+data.customer_name+'\nDecision: '+data.decision+'\nTotal: '+(data.total||data.quote_total));$('small').innerHTML='If needed, <a class="fallback" href="mailto:'+encodeURIComponent(data.business_email)+'?subject='+s+'&body='+b+'">email the business manually</a>.'}})
})();
</script></body></html>
